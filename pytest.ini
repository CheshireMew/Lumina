[pytest]
testpaths =
    automation/tests
    automation/tests_pytest
    automation/tests_pytest_real
python_files = test_*.py *_test.py pytest_*.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -p no:warnings
markers =
    unit: Fast tests without external services
    integration: Cross-component tests
    e2e: Tests that require a running Lumina stack
    slow: Long-running tests
    security: Security-focused tests
    performance: Performance tests
    requires_auth: Tests requiring authentication
    requires_db: Tests requiring an external database
    requires_llm: Tests requiring an external LLM
    requires_stt: Tests requiring an STT runtime
    requires_tts: Tests requiring a TTS runtime
    backend: Backend hardening tests
    infra: Infrastructure and process tests
