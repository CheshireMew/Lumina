name: Performance Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/renderer/**"
      - "core/voice/**"
      - "python_backend/memory/**"
      - "python_backend/provider_drivers/memory_sqlite/**"
      - "python_backend/services/companion/**"
      - "automation/tests_pytest/performance/**"
      - ".github/workflows/performance.yml"
  push:
    branches: [main]
    paths:
      - "app/renderer/**"
      - "core/voice/**"
      - "python_backend/memory/**"
      - "python_backend/provider_drivers/memory_sqlite/**"
      - "python_backend/services/companion/**"
      - "automation/tests_pytest/performance/**"
      - ".github/workflows/performance.yml"

jobs:
  windows-test-timings:
    name: Windows regression timings
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r python_backend/requirements-test.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Enforce backend performance budgets
        run: python -m pytest -q -p no:cacheprovider automation/tests_pytest/performance/test_runtime_regressions.py --durations=10
      - name: Enforce renderer streaming budgets
        run: npm run test:performance
