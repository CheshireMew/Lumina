name: Security Regression

on:
  workflow_dispatch:

jobs:
  windows-security-tests:
    name: Windows security regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r python_backend/requirements-test.txt
      - name: Run maintained security tests
        run: python -m pytest -q -p no:cacheprovider automation/tests/security
