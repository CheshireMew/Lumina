name: Security Scan

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
    paths:
      - 'python_backend/**'
      - 'requirements.txt'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ========================================================================
  # Job 1: Bandit Security Linter
  # ========================================================================
  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run bandit scan
        run: |
          bandit -r python_backend/ \
            -f json \
            -o bandit-results.json \
            --skip B101,B601 \
            || true

      - name: Generate bandit report
        run: |
          bandit -r python_backend/ \
            -f txt \
            -o bandit-report.txt \
            --skip B101,B601 \
            || true

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: |
            bandit-results.json
            bandit-report.txt
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bandit-report.txt', 'utf8');
            const output = `### Bandit Security Scan Results\n\n\`\`\`\n${report}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ========================================================================
  # Job 2: Safety Dependency Vulnerability Scan
  # ========================================================================
  safety-scan:
    name: Safety Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Run safety check
        run: |
          safety check \
            --file python_backend/requirements.txt \
            --json \
            > safety-results.json \
            || true

      - name: Run safety check (full report)
        run: |
          safety check \
            --file python_backend/requirements.txt \
            --full-report \
            || true

      - name: Upload safety results
        uses: actions/upload-artifact@v4
        with:
          name: safety-results
          path: safety-results.json
          retention-days: 30

      - name: Create safety summary
        run: |
          echo "### Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s safety-results.json ]; then
            echo ":warning: Vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo ":white_check_mark: No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================================================
  # Job 3: Secrets Detection
  # ========================================================================
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: TruffleHog Secret Scanning
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --only-verified \
            --json \
            --fail \
            --no-update

  # ========================================================================
  # Job 4: Pytest Security Tests
  # ========================================================================
  pytest-security:
    name: Pytest Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-html httpx

      - name: Run security test suite
        working-directory: automation
        run: |
          pytest tests_pytest/security/ \
            -v \
            -m "security or security_scan" \
            --junitxml=security-test-results.xml \
            --html=security-test-report.html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-security-results
          path: |
            automation/security-test-results.xml
            automation/security-test-report.html
          retention-days: 30

      - name: Generate pytest summary
        if: always()
        run: |
          if [ -f automation/security-test-results.xml ]; then
            echo "### Security Pytest Results" >> $GITHUB_STEP_SUMMARY
            python -c "import xml.etree.ElementTree as ET; root = ET.parse('automation/security-test-results.xml').getroot(); print(f'- tests: {root.attrib.get(\"tests\", \"0\")}'); print(f'- failures: {root.attrib.get(\"failures\", \"0\")}'); print(f'- errors: {root.attrib.get(\"errors\", \"0\")}'); print(f'- skipped: {root.attrib.get(\"skipped\", \"0\")}')" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================================================
  # Job 5: Snyk Security Scan (optional)
  # ========================================================================
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    # Only run if SNYK_TOKEN is set
    if: vars.SNYK_TOKEN != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snyk
        run: |
          python -m pip install --upgrade pip
          pip install snyk

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=python_backend/requirements.txt \
            --json-file-output=snyk-results.json \
            || true

      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30

  # ========================================================================
  # Job 6: Security Summary Report
  # ========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [bandit-scan, safety-scan, secrets-scan, pytest-security]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ${{ needs.bandit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety | ${{ needs.safety-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest Security | ${{ needs.pytest-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Full reports available in artifacts*" >> $GITHUB_STEP_SUMMARY
