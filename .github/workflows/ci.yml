name: Lumina CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  windows-validation:
    name: Windows source validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r python_backend/requirements-test.txt

      - name: Verify source and runtime contracts
        shell: pwsh
        run: |
          npm run verify-build
          npm run gen-types
          git diff --exit-code -- app/renderer/types/api-schema.d.ts

      - name: Check frontend
        shell: pwsh
        run: |
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Check Python
        shell: pwsh
        run: |
          ruff check python_backend automation scripts/export_openapi.py
          npm run test:python
