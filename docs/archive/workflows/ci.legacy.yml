# 已归档：旧版跨平台 CI，仅供追溯。
name: Lumina CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows-validation:
    name: Windows source validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r python_backend/requirements-test.txt

      - name: Verify source and runtime contracts
        run: npm run verify-build

      - name: Check frontend
        shell: pwsh
        run: |
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Check Python
        shell: pwsh
        run: |
          ruff check python_backend automation/tests --select E9,F63,F7,F82
          npm run test:python

  # ========================================================================
  # Job 1: Lint and Code Quality
  # ========================================================================
  lint:
    name: Code Quality & Linting
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Run ruff linter
        run: |
          ruff check python_backend/ --output-format=github

      - name: Run ruff format check
        run: |
          ruff format --check python_backend/

      - name: Run bandit security scan
        run: |
          bandit -r python_backend/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ========================================================================
  # Job 2: Unit Tests (pytest - fast, no services)
  # ========================================================================
  unit-tests:
    name: Unit Tests
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        working-directory: automation
        run: |
          pytest tests_pytest/ -v -m "not integration and not e2e" --cov=../python_backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./automation/coverage.xml
          flags: unit-tests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: automation/htmlcov/
          retention-days: 7

  # ========================================================================
  # Job 3: Backend Integration Tests (requires services)
  # ========================================================================
  integration-tests:
    name: Integration Tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    services:
      # Add required services here if using containers
      # surrealdb:
      #   image: surrealdb/surrealdb:latest
      #   ports:
      #     - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Start backend services
        working-directory: python_backend
        run: |
          # Start services in background
          python main.py &
          sleep 10

      - name: Run E2E Tests
        working-directory: automation
        run: |
          pytest tests_pytest/e2e/ -v -m integration --timeout=120 --junitxml=pytest-results/e2e-tests.xml

      - name: Run Real Service Tests
        working-directory: automation
        run: |
          pytest tests_pytest_real/ -v --junitxml=pytest-results/real-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: automation/pytest-results/
          retention-days: 7

  # ========================================================================
  # Job 4: Security Tests
  # ========================================================================
  security-tests:
    name: Security Scanning
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pytest

      - name: Run bandit security scan
        run: |
          bandit -r python_backend/ -f json -o bandit-report.json || true

      - name: Run safety dependency check
        run: |
          safety check --file python_backend/requirements.txt --json --output safety-report.json || true

      - name: Run pytest security tests
        working-directory: automation
        run: |
          pytest tests_pytest/security/ -v -m security_scan

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

      - name: Security scan summary
        run: |
          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            echo "- Bandit scan completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f safety-report.json ]; then
            echo "- Safety dependency check completed" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================================================
  # Job 5: Performance Benchmarks
  # ========================================================================
  performance-tests:
    name: Performance Benchmarks
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark

      - name: Run performance benchmarks
        working-directory: automation
        run: |
          pytest tests_pytest/performance/ -v --benchmark-only --benchmark-json=../benchmark-results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "pytest"
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: "@maintainer"

  # ========================================================================
  # Job 6: Build Test (Electron app)
  # ========================================================================
  build:
    name: Build Electron App
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    needs: [unit-tests, integration-tests]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Electron app
        run: |
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-build-${{ matrix.os }}
          path: dist/
          retention-days: 7

  # ========================================================================
  # Job 7: Test Summary
  # ========================================================================
  test-summary:
    name: Test Summary
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs:
      [lint, unit-tests, integration-tests, security-tests, performance-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
