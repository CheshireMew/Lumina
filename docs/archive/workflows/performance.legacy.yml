# 已归档：旧版性能工作流，仅供追溯。
name: Performance Benchmarks

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows-test-timings:
    name: Windows regression timings
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python_backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r python_backend/requirements-test.txt
      - name: Report slowest tests
        run: python -m pytest -q -p no:cacheprovider automation/tests --durations=25

  # ========================================================================
  # Job 1: Run Performance Benchmarks
  # ========================================================================
  benchmarks:
    name: Performance Benchmarks
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark pytest-cov

      - name: Run benchmarks
        working-directory: automation
        run: |
          pytest tests_pytest/performance/ \
            -v \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=min,max,mean,stddev,median,ops/sec \
            --benchmark-sort=name

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: automation/benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@maintainer'
          benchmark-data-dir-path: benchmark-data

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: automation/benchmark-results.json
          retention-days: 90

      - name: Generate benchmark summary
        run: |
          echo "### Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('automation/benchmark-results.json', 'r') as f:
              data = json.load(f)
              benchmarks = data.get('benchmarks', [])
              print('| Benchmark | Min | Max | Mean | Median | Ops/sec |')
              print('|-----------|-----|-----|------|--------|---------|')
              for b in benchmarks[:10]:  # First 10
                  name = b['name'].split('[')[0].strip()
                  stats = b['stats']
                  min_t = f\"{stats['min']:.6f}\"
                  max_t = f\"{stats['max']:.6f}\"
                  mean_t = f\"{stats['mean']:.6f}\"
                  median_t = f\"{stats['median']:.6f}\"
                  ops = f\"{stats['ops']:.2f}\" if 'ops' in stats else 'N/A'
                  print(f'| {name} | {min_t} | {max_t} | {mean_t} | {median_t} | {ops} |')
          " >> $GITHUB_STEP_SUMMARY

  # ========================================================================
  # Job 2: Memory Leak Detection
  # ========================================================================
  memory-leaks:
    name: Memory Leak Detection
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run memory leak tests
        working-directory: automation
        run: |
          pytest tests_pytest/memory/ \
            -v \
            --junitxml=memory-test-results.xml \
            -s

      - name: Upload memory test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-test-results
          path: automation/memory-test-results.xml
          retention-days: 30

      - name: Generate memory summary
        run: |
          echo "### Memory Leak Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f automation/memory-test-results.xml ]; then
            echo ":white_check_mark: Memory tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Memory tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================================================
  # Job 3: Load Testing
  # ========================================================================
  load-tests:
    name: Load Testing
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locust
        run: |
          python -m pip install --upgrade pip
          pip install locust

      - name: Run load tests
        working-directory: automation
        run: |
          locust -f tests_pytest/load/test_load.py \
            --headless \
            --users 50 \
            --spawn-rate 10 \
            --run-time 30s \
            --host http://127.0.0.1:8010 \
            --html load-test-report.html \
            --json \
            --logfile load-test.log

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            automation/load-test-report.html
            automation/load-test.log
          retention-days: 30

  # ========================================================================
  # Job 4: Performance Regression Detection
  # ========================================================================
  regression-check:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: benchmarks
    if: ${{ false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark

      - name: Run baseline benchmarks
        working-directory: automation
        run: |
          pytest tests_pytest/performance/ \
            --benchmark-only \
            --benchmark-json=baseline-results.json

      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Run PR benchmarks
        working-directory: automation
        run: |
          pytest tests_pytest/performance/ \
            --benchmark-only \
            --benchmark-json=pr-results.json

      - name: Compare results
        run: |
          python automation/scripts/compare_benchmarks.py \
            --baseline automation/baseline-results.json \
            --current automation/pr-results.json \
            --threshold 1.2 \
            --output comparison-report.md

      - name: Comment PR with comparison
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('automation/comparison-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # ========================================================================
  # Job 5: Performance Summary
  # ========================================================================
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [benchmarks, memory-leaks]
    if: ${{ false }}
    steps:
      - name: Generate summary
        run: |
          echo "# Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Leaks | ${{ needs.memory-leaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo ":chart_with_upwards_trend: Full benchmark reports available in artifacts" >> $GITHUB_STEP_SUMMARY
