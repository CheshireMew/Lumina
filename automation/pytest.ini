[pytest]
# Pytest configuration for Lumina testing

# Test discovery patterns
python_files = test_*.py *_test.py pytest_*.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --color=yes
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires services)
    e2e: End-to-end tests (full system)
    slow: Slow-running tests
    security: Security-related tests
    performance: Performance tests
    requires_auth: Tests requiring authentication
    requires_db: Tests requiring database
    requires_llm: Tests requiring LLM service
    requires_stt: Tests requiring STT service
    requires_tts: Tests requiring TTS service
    backend: Deep backend hardening tests
    infra: Infrastructure and process management tests

# Coverage options (when using pytest-cov)
[coverage:run]
source = ../python_backend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
