id: system.emotion_broker
api_version: "1.0"
kind: processor
capability: chat.post_processor
runtime_target: main
permissions:
  - eventbus.subscribe
  - eventbus.emit
config_schema:
  tag_pattern: "\\[(joy|happy|sad|angry|surprised|neutral|thinking|embarrassed)\\]"
  strip_tags: false
  default_emotion: neutral
provides:
  - avatar
