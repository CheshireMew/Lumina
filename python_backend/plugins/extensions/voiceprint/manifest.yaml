id: system.voiceprint
group_id: system
name: Voiceprint Security
description: "Biometric voice authentication. Only allow enrolled users to wake the system."
version: "1.0.0"
runtime_target: stt_server
entrypoint: manager:VoiceprintManager
type: extension
category: stt
func_tag: "Voice Security"
author: Lumina
permissions:
  - audio_capture
  - filesystem.read
ui_slots: []
tags: ["security", "voice"]

# [Capability Contract]
provides:
  - type: system.extension
    attributes:
      feature: voice_security
      biometrics: true

# [Standard Config Schema]
config_schema:
  key: "voiceprint_threshold"
  type: "number"
  label: "Verify Threshold"
  default: 0.6
  min: 0.1
  max: 0.9
  step: 0.05
