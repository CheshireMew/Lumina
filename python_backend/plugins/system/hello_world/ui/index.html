<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                margin: 0;
                padding: 16px;
                font-family: sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                overflow: hidden;
            }
            .card {
                text-align: center;
            }
            h3 {
                margin: 0 0 8px 0;
                font-size: 14px;
                opacity: 0.8;
            }
            p {
                margin: 0;
                font-weight: bold;
                font-size: 18px;
            }
            .badge {
                display: inline-block;
                background: rgba(255, 255, 255, 0.2);
                padding: 2px 8px;
                border-radius: 12px;
                font-size: 10px;
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h3>System Status</h3>
            <p>✅ Online</p>
            <div class="badge">Plugin System Active</div>
        </div>
        <script>
            console.log("Hello World Widget Loaded!");
        </script>
    </body>
</html>
