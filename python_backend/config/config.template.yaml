# Lumina Unified Configuration
# This file is the Single Source of Truth for system settings.
# Override values here instead of editing disparate JSON files.

network:
  host: "127.0.0.1"
  memory_port: 8010
  stt_port: 8765
  tts_port: 8766
  bind_localhost_only: true

memory:
  namespace: "lumina"
  database: "memory"
  character_id: "hiyori"
  postgres:
    host: "127.0.0.1"
    port: 5432
    user: "lumina_user"
    password: "" # LUMINA_PG_PASSWORD
    database: "lumina_db"

llm:
  model: "deepseek-chat"
  base_url: "http://localhost:11434/v1"
  api_key: ""

audio:
  device_name: null
  speech_start_threshold: 0.6
  speech_end_threshold: 0.05
  min_speech_frames: 15
  enable_voiceprint_filter: false
  voiceprint_threshold: 0.45
  voiceprint_profile: "default"

stt:
  model: "base"
  device: "cuda"
  compute_type: "float16"
  language: "zh"

tts:
  voice: "zh-CN-XiaoxiaoNeural"

search:
  enabled: true

plugins:
  selected_providers:
    memory: "driver.memory.postgres"
    stt: "driver.stt.sensevoice"
    tts: "driver.tts.edge"
    tool.search: "driver.tool.search.brave"
    vision: "driver.vision.moondream"
  desired_state: {}
  prewarm_core: true
  settings:
    driver.tool.search.brave:
      api_key: ""

models:
  embedding_model_name: "text-embedding-3-small"
  stt_model_path: null
  tts_model_path: null
