# Lumina Unified Configuration
# This file is the Single Source of Truth for system settings.
# Override values here instead of editing disparate JSON files.

network:
  host: "127.0.0.1"
  memory_port: 8010
  stt_port: 8765
  tts_port: 8766
  bind_localhost_only: true

memory:
  namespace: "lumina"
  database: "memory"
  character_id: "hiyori"
  postgres:
    host: "127.0.0.1"
    port: 5432
    user: "lumina_user"
    password: "" # LUMINA_PG_PASSWORD
    database: "lumina_db"

llm:
  providers:
    free_tier:
      id: "free_tier"
      type: "pollinations"
      base_url: ""
      api_key: "none"
      models:
        - "gpt-4o-mini"
        - "claude-3-haiku"
      enabled: true
    custom_provider:
      id: "custom_provider"
      type: "openai"
      base_url: "http://localhost:11434/v1"
      api_key: ""
      models: []
      enabled: true
  routes:
    chat:
      feature: "chat"
      provider_id: "free_tier"
      model: "gpt-4o-mini"
    memory:
      feature: "memory"
      provider_id: "free_tier"
      model: "gpt-4o-mini"
    dreaming:
      feature: "dreaming"
      provider_id: "free_tier"
      model: "gpt-4o-mini"
    evolution:
      feature: "evolution"
      provider_id: "free_tier"
      model: "gpt-4o-mini"
    proactive:
      feature: "proactive"
      provider_id: "free_tier"
      model: "gpt-4o-mini"
    vision:
      feature: "vision"
      provider_id: "free_tier"
      model: "gpt-4o"

audio:
  device_name: null
  speech_start_threshold: 0.6
  speech_end_threshold: 0.05
  min_speech_frames: 15
  enable_voiceprint_filter: false
  voiceprint_threshold: 0.45
  voiceprint_profile: "default"

stt:
  model: "base"
  device: "cuda"
  compute_type: "float16"
  language: "zh"

tts:
  voice: "zh-CN-XiaoxiaoNeural"

search:
  enabled: true

capabilities:
  selected_providers:
    memory: "driver.memory.postgres"
    stt: "driver.stt.sensevoice"
    tts: "driver.tts.edge"
    tool.search: "driver.tool.search.brave"
    vision: "driver.vision.moondream"
  desired_state: {}
  prewarm_core: true
  supervise_workers: false
  settings:
    driver.tool.search.brave:
      api_key: ""

models:
  embedding_model_name: "text-embedding-3-small"
  stt_model_path: null
  tts_model_path: null
